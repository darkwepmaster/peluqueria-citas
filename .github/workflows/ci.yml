name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - run: mvn -B -f backend-java/pom.xml verify
  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet build recordatorios-csharp/PeluqueriaRecordatorios.csproj -c Release
      - run: dotnet test tests-csharp/PeluqueriaWeb.Tests/PeluqueriaWeb.Tests.csproj
