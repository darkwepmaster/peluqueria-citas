server.port=8080
spring.application.name=peluqueria-api
# Perfil por defecto: H2 en memoria (no requiere instalar nada)
spring.datasource.url=jdbc:h2:mem:peluqueria;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:cambiar-esta-clave-secreta-de-32-bytes-minimo-123456}
app.jwt.horas=8
app.zona=America/Lima
# Carga datos de demostración (usuarios, estilistas y servicios) si la BD está vacía
app.seed=true
